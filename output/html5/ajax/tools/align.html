<form id="align">
<table>
<tr><td><label for="input1">Align value 1 </label></td><td><input type="number" name="input1" id="input1"  value="0" min="0" max="1e+50" required><span id="input1_msg" class="warning" > </span></td></tr>
<script>
setLastValue( "align", "#input1" );
$( "#input1" ).blur( function() { checkFloat( "#input1" ); });
$( "#input1" ).keypress( function() { $( "#input1_msg" ).html( "" ); });
</script>
<tr><td><label for="input2">Align value 2 </label></td><td><input type="number" name="input2" id="input2" value="1" min="-10" max="10"><span id="input2_msg" class="warning" > </span></td></tr>
<script>
setLastValue( "align", "#input2" );
$( "#input2" ).blur( function() { checkInt( "#input2" ); });
$( "#input2" ).keypress( function() { $( "#input2_msg" ).html( "" ); });
</script>
<tr><td><label for="input3" class="highlight">Align value 3 </label></td><td><input type="checkbox" name="input3" id="input3" checked></td></tr>
<script>
setLastValue( "align", "#input3" );
</script>
</table>
<p><button id="align_submit"><span class="buttontext">Submit</span></button>
<button id="align_reset"><span class="buttontext">Reset to default values</span></button></p>
<span id="align_progress"></span>
<script>
//function progressHandlingFunction(e){
//    if(e.lengthComputable){
//        $('#align_progress progress').attr({value:e.loaded,max:e.total});
//    }
//}
$( "#align_submit" ).click( function() {
    $( "#align_results" ).text( "" );
    var output_msgs = $("#align_output #msgs");
    output_msgs.text( "" );
    console.log( $( "#align" ).serializeArray() );
    saveLastValues( "align" );
    resetDefaultValues( "align_output" );

    var found_errors = 0;
    $("#align").find("input").each(function(i){
//      console.log("values:" + $(this).attr('id') + " required:" + $(this).attr( 'required' ) +  
//      " val:" + $(this).val() + " val-len:" + $(this).val().length
//      );
//      if ( $(this).attr( 'multiple' ) )
//      {
//         var filelist = document.getElementById( $(this).attr( 'id' ) ).files || [];
//         for ( var i = 0; i < filelist.length; ++i )
//         {                               
//              console.log(" file " + i + " " + filelist[i].name );
//         }
//      }
      if ( $(this).attr( 'required' ) && $(this).val().length == 0 )
      {
          var tag =  "#align " + "#" + $(this).attr('id') + "_msg";
          console.log( "missing: " + tag );
          $( tag ).html( "missing required field" );
          found_errors = 1;
      }
    });
    console.log( "hi2" );
    if ( found_errors )
    {
        return false;
    }

    var formData = new FormData($('form')[0]);
    console.log( "calling ajax" );
    $('#align_progress').html( "Uploading:<progress></progress>" );
    $.ajax( {
             dataType: "json",
             cache:false,
//             timeout:3000,  // for testing
             type:"POST",
             url:"ajax/tools/align.php",
             data: formData,
             xhr: function() {  // Custom XMLHttpRequest
                 var myXhr = $.ajaxSettings.xhr();
                 if(myXhr.upload){ // Check if upload property exists
                     myXhr.upload.addEventListener('progress',
                         function(e) {
                         if(e.lengthComputable){
                           $('#align_progress progress').attr({value:e.loaded,max:e.total});
                         } }
//                     progressHandlingFunction
                    , false);
                 }
                 return myXhr;
             },
             cache: false,
             contentType: false,
             processData: false
            } )
    .done( function( data, status, xhr ) {
           console.log( "data, status, xhr" );
           console.log( data );
           console.log( status );
           console.log( xhr );
// loop through data pairs
           var appended = 0;
           $.each(data, function(k, v) {
           
               console.log( k + " => " + v );                         
               var match = $( "#align_output" ).find( "#" + k );
               if ( match.length )
               {
                   switch ( match.attr( "type" ) )
                   {
                        case "plot2d" : $.plot( match, v, gd.data( "_plot_options" ) ); 
                               var savekey = "align_output:#" + k + ":last_value";
                               $( "#global_data" ).data( savekey , v ); 
                               break;
                       case "checkbox" : 
                       case "radio" : 
                               match.prop( "checked", true ); break;
                       default : match.val( v ); break;
                   }
               } else {
                     if ( !appended )
                     {
                        output_msgs.append( "<p>Unexpected results:</p>" );
                        appended = 1;
                     }
                     output_msgs.append( "<p>" + k + " => " + v + "</p>" );
               }
           });
           saveLastValues( "align_output" );
           saveLastValue( "align_output", "#msgs" );
           $('#align_progress').html( "" );
          } )
    .fail( function( xhr, status, errorThrown ) {
           console.log( "xhr, status, errorThrown" );
           console.log( xhr );
           console.log( status );
           console.log( errorThrown );
           $( "#align_results" ).html( "<span class=\"warning\"> Failed: " + status + " : '" + xhr.status + ":" + errorThrown + "' on URL ajax/tools/align.php </span>" );
           $('#align_progress').html( "" );
          } );
    return false;
});
$( "#align_reset" ).click( function() {
    resetDefaultValues( "align" );
    resetDefaultValues( "align_output" );
    resetDefaultValue( "align_output", "#msgs" );
    return false;
});
</script>
</form>
<div id="align_results"></div>
<hr>
<form id="align_output">
<div id="msgs" class="warning" type="msgs"></div>
<script>
setLastValue( "align_output", "#msgs" );
$( "#global_data" ).data( "_extra_resets", [] );
</script>
<table>
<tr><td><label for="output1">Output value 1 </label></td><td><input type="number" name="output1" id="output1" readonly></td></tr>
<script>
setLastValue( "align_output", "#output1" );
</script>
</table>
</form>
