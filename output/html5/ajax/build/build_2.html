<script>
//function progressHandlingFunction(e){
//    if(e.lengthComputable){
//        $('#build_2_progress progress').attr({value:e.loaded,max:e.total});
//    }
//}
$( "#build_2_submit" ).click( function() {
    $( "#build_2_results" ).text( "" );
    var output_msgs = $("#build_2_output #msgs");
    output_msgs.text( "" );
    console.log( $( "#build_2" ).serializeArray() );
    saveLastValues( "build_2" );
    resetDefaultValues( "build_2_output" );

    var found_errors = 0;
    $("#build_2").find("input").each(function(i){
//      console.log("values:" + $(this).attr('id') + " required:" + $(this).attr( 'required' ) +  
//      " val:" + $(this).val() + " val-len:" + $(this).val().length
//      );
//      if ( $(this).attr( 'multiple' ) )
//      {
//         var filelist = document.getElementById( $(this).attr( 'id' ) ).files || [];
//         for ( var i = 0; i < filelist.length; ++i )
//         {                               
//              console.log(" file " + i + " " + filelist[i].name );
//         }
//      }
      if ( $(this).attr( 'required' ) && $(this).val().length == 0 )
      {
          var tag =  "#build_2 " + "#" + $(this).attr('id') + "_msg";
          console.log( "missing: " + tag );
          $( tag ).html( "missing required field" );
          found_errors = 1;
      }
    });
    console.log( "hi2" );
    if ( found_errors )
    {
        return false;
    }

    var formData = new FormData($('form')[0]);
    console.log( "calling ajax" );
    $('#build_2_progress').html( "Uploading:<progress></progress>" );
    $.ajax( {
             dataType: "json",
             cache:false,
//             timeout:3000,  // for testing
             type:"POST",
             url:"ajax/build/build_2.php",
             data: formData,
             xhr: function() {  // Custom XMLHttpRequest
                 var myXhr = $.ajaxSettings.xhr();
                 if(myXhr.upload){ // Check if upload property exists
                     myXhr.upload.addEventListener('progress',
                         function(e) {
                         if(e.lengthComputable){
                           $('#build_2_progress progress').attr({value:e.loaded,max:e.total});
                         } }
//                     progressHandlingFunction
                    , false);
                 }
                 return myXhr;
             },
             cache: false,
             contentType: false,
             processData: false
            } )
    .done( function( data, status, xhr ) {
           console.log( "data, status, xhr" );
           console.log( data );
           console.log( status );
           console.log( xhr );
// loop through data pairs
           var appended = 0;
           $.each(data, function(k, v) {
           
               console.log( k + " => " + v );                         
               var match = $( "#build_2_output" ).find( "#" + k );
               if ( match.length )
               {
                   switch ( match.attr( "type" ) )
                   {
                        case "plot2d" : $.plot( match, v, gd.data( "_plot_options" ) ); 
                               var savekey = "build_2_output:#" + k + ":last_value";
                               $( "#global_data" ).data( savekey , v ); 
                               break;
                       case "checkbox" : 
                       case "radio" : 
                               match.prop( "checked", true ); break;
                       default : match.val( v ); break;
                   }
               } else {
                     if ( !appended )
                     {
                        output_msgs.append( "<p>Unexpected results:</p>" );
                        appended = 1;
                     }
                     output_msgs.append( "<p>" + k + " => " + v + "</p>" );
               }
           });
           saveLastValues( "build_2_output" );
           saveLastValue( "build_2_output", "#msgs" );
           $('#build_2_progress').html( "" );
          } )
    .fail( function( xhr, status, errorThrown ) {
           console.log( "xhr, status, errorThrown" );
           console.log( xhr );
           console.log( status );
           console.log( errorThrown );
           $( "#build_2_results" ).html( "<span class=\"warning\"> Failed: " + status + " : '" + xhr.status + ":" + errorThrown + "' on URL ajax/build/build_2.php </span>" );
           $('#build_2_progress').html( "" );
          } );
    return false;
});
$( "#build_2_reset" ).click( function() {
    resetDefaultValues( "build_2" );
    resetDefaultValues( "build_2_output" );
    resetDefaultValue( "build_2_output", "#msgs" );
    return false;
});
</script>
