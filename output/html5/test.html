<body>

<div id="global_data"> </div>
<script> 
gd = $( "#global_data" );
function checkFloat( tag )
{
   var t = $( tag );
   var fieldValue=t.val();
   if ( isNaN( fieldValue ) )
   {
       t.val( t.prop( "defaultValue" ) );
       $( tag + "_msg" ).html( " not a valid floating point number, reset to default" );
   } else {
       if ( fieldValue < parseFloat ( t.attr( "min" ) ) )
       { 
           t.val( t.attr( "min" ) );
           $( tag + "_msg" ).html( " value set to minimum allowed" );
       } else {
           if ( fieldValue > parseFloat ( t.attr( "max" ) ) )
           { 
               t.val( t.attr( "max" ) );
               $( tag + "_msg" ).html( " value set to maximum allowed" );
           } else {
               $( tag + "_msg" ).html( "" );
           }
       } 
   }
}


gd.data( "_plot_options", 
 {
   font : {
             color : "rgb( 220,210,210 )"
          },
//   grid : {
//             color : "rgb( 220,210,210 )",
//             boarderWidth : 0.5
//          },
   xaxis : {
//             color : "rgb( 220,210,210 )",
             color : "gray",
             lineWidth : 0.5,
             font : {
                 color : "rgb( 220,210,210 )"
             }
          },
   yaxis : {
//             color : "rgb( 220,210,210 )",
             color : "gray",
             lineWidth : 0.5,
             font : {
                 color : "rgb( 220,210,210 )"
             }
          },
   lines: { 
            lineWidth : 1.0
          } 
} );

function checkInt( tag )
{
   var t = $( tag );
   var fieldValue=t.val();
   if ( isNaN( fieldValue ) )
   {
       t.val( t.prop( "defaultValue" ) );
       $( tag + "_msg" ).html( " not a valid number, reset to default" );
   } else {
       if ( fieldValue < parseInt ( t.attr( "min" ) ) )
       { 
           t.val( t.attr( "min" ) );
           $( tag + "_msg" ).html( " value set to minimum allowed" );
       } else {
           if ( fieldValue > parseInt ( t.attr( "max" ) ) )
           { 
               t.val( t.attr( "max" ) );
               $( tag + "_msg" ).html( " value set to maximum allowed" );
           } else {
               if ( parseInt( fieldValue ) != fieldValue )
               {   
                   $( tag + "_msg" ).html( " value rounded to nearset integer" );
                   t.val( parseInt( parseFloat( fieldValue ) + .5 ) );
               } else {
                   $( tag + "_msg" ).html( "" );
               }
           }
       }
   }
}

function setLastValue( pkg, tag ) {
//    console.log( "setLastValue pkg:" + pkg + " tag:" + tag );
    var tl = pkg + ":" + tag + ":last_value";
    var t = $( tag );
    if ( $( "#global_data" ).data( tl ) == undefined ) {
        switch( t.attr( "type" ) )
        {
            case "checkbox" :
                $( "#global_data" ).data( tl, t.is( ":checked") );
                $( "#global_data" ).data( pkg + ":" + tag + ":default_value", t.is( ":checked") ); break;
            case "msgs" : 
                $( "#global_data" ).data( tl, t.html() ); 
                $( "#global_data" ).data( pkg + ":" + tag + ":default_value", t.html() );
                break;
            case "plot2d" :
// console.log( "setLastValue on undefined plot2d not yet: " + tl ); 
                           break;
            default : $( "#global_data" ).data( tl, t.val() ); break;
        }
    } else {
        switch( t.attr( "type" ) )
        {
            case "checkbox": t.prop( "checked", $( "#global_data" ).data( tl ) ); break;
            case "msgs" : t.html( $( "#global_data" ).data( tl ) ); break;
            case "plot2d" : 
//                     console.log( "setLastValue on plot2d trying" );
                     t.plot( $( "#global_data" ).data( tl ), gd.data( "_plot_options" ) ); break;
            default: t.val( $( "#global_data" ).data( tl ) ); break;
        }
    }
//    console.log( "t is " + t );
//    console.log( $( "#global_data" ).data( t ) ); 
}

function saveLastValue( pkg, tag ) {
//   console.log( "saveLastValue pkg:" + pkg + " tag:" + tag );
   var t = $( tag );
   switch( t.attr( "type" ) )
   {
       case "checkbox" : $( "#global_data" ).data( pkg + ":" + tag + ":last_value", t.is( ":checked") ); break;
       case "msgs" : $( "#global_data" ).data( pkg + ":" + tag + ":last_value", t.html() ); break;
       case "plot2d" : 
// console.log( "saveLastValue on plot2d not yet" );  
                       break;
       default: $( "#global_data" ).data( pkg + ":" + tag + ":last_value", t.val() ); break;
   }
//   console.log( "t is " + pkg + ":" + tag + ":last_value" );
//   console.log( $( "#global_data" ).data( pkg + ":" + tag + ":last_value" ) ); 
}

function saveLastValues( pkg ) {
//   console.log( "saveLastValues " + pkg );
   $( "#" + pkg + " input" ).each(function() {
      saveLastValue( pkg, "#" + $( this ).attr( "id" ) );
   });
}

function resetDefaultValue( pkg, tag ) {
//   console.log( "resetDefaultValue pkg:" + pkg + " tag:" + tag );
   var t = $( tag );
   switch( t.attr( "type" ) )
   {
       case "checkbox" : t.prop( "checked", $( "#global_data" ).data( pkg + ":" + tag + ":default_value" ) ); break;
       case "msgs" : t.html( $( "#global_data" ).data( pkg + ":" + tag + ":default_value" ) ); 
//                     console.log( "setting t.html from msgs to:" );
//                     console.log( $( "#global_data" ).data( pkg + ":" + tag + ":default_value" ) );
                     break;
       case "plot2d" : 
//                     console.log( "resetDefaultValue on plot2d trying" );
                     $( "#global_data" ).data( pkg + ":" + tag + ":last_value", [[]] );
                     t.plot( [[]], gd.data( "_plot_options") ); break;
                     break;
       default: t.val( t.attr( "value" ) ); break;
   }
   saveLastValue( pkg, tag );
   $( tag + "_msg" ).html("");
}

function resetDefaultValues( pkg ) {
//   console.log( "resetDefautValues " + pkg );
   $( "#" + pkg + " input" ).each(function() {
      resetDefaultValue( pkg, "#" + $( this ).attr( "id" ) );
   });
   var e = $( "#global_data" ).data( "_extra_resets" );
   for ( var i in e ) 
   {
//      console.log( "extra_resets " + e[i] );
      resetDefaultValue( pkg, "#" + e[i] );
   }
}

</script>

<div id="panelmain" >

<div>
<script>
    var count = 0;
    var sidewidth = parseFloat( $( ".sidebar" ).css( "width" ) ) + 
                    parseFloat( $( ".sidebar" ).css( "padding-left" ) ) +
                    parseFloat( $( ".sidebar" ).css( "padding-right" ) ) +
                    parseFloat( $( ".sidebar" ).css( "border-left-width" ) ) +
                    parseFloat( $( ".sidebar" ).css( "border-right-width" ) ) +
                    parseFloat( $( ".sidebar" ).css( "margin-left" ) ) +
                    parseFloat( $( ".sidebar" ).css( "margin-right" ) )
    ;
    var speed = 400;
    $( "#panelmain" ).css( "left", count % 2 ? 0 : sidewidth );
    // console.log( "sidewidth: " + sidewidth );

    $( ".sidebar ul li" ).click( function() {
        // this was is simpler, but bugs out on seamonkey linux
        // var myImg = $( "header span img" );
        // myImg.attr( 'src', 'pngs/' +  $( this ).attr( "id" ) + '.png' );
        // myImg.attr( 'id', $( this ).attr( "id" ) );
        // this is what we needed to do
        // var myHtml = "<img height=50px id='" + $( this ).attr( "id" ) + "' src='pngs/" +  $( this ).attr( "id" ) + ".png'>";
        // console.log( $( "#seabug" ).html() );
        // console.log( myHtml );
        var myTag = $( this ).attr( "id" );
        $( "#seabug" ).html( "<img height=50px style=\"vertical-align:middle\" id='" + myTag + "' src='pngs/" +  myTag + ".png'>" );
        $( "#panelmain" ).load( "ajax/" + myTag + ".html" );
        $( "#menuspan" ).trigger( "click" );
    } );

    function menuOnOff(event) {
        count++;
        // console.log( count % 2 ? "menuonoff true" : "menuonoff false" );
        var ofs = count % 2 ? 0 : sidewidth;
        var wid = count % 2 ? '100%' : $("#panelmain").parent().parent().width() - sidewidth - 20;
        // console.log( $("#panelmain").parent().parent().width() );
    
        // console.log( "sidewidth at click: " + sidewidth );
        // console.log( "parentparentwidth at click: " + $("#panelmain").parent().parent().width() );
        // console.log( "width on click: " + wid );


        $( ".toggle" ).toggle( speed );
        $( "#panelmain" ).animate( {left: ofs, width: wid }, speed );
    }

    $( window ).resize(function() {
        var ofs = count % 2 ? 0 : sidewidth;
        var wid = count % 2 ? '100%' : $( "#panelmain" ).parent().parent().width() - sidewidth - 20;
        // console.log( "sidewidth at resize: " + sidewidth );
        // console.log( "parentparentwidth at resize: " + $("#panelmain").parent().parent().width() );
        // console.log( "width on resize: " + wid );

        $( "#panelmain" ).css( "left", ofs ).css( "width", wid );
    } );

</script>
